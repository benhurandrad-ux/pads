<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0e16">
<title>King Pad Admin</title>
<link rel="icon" href="../favicon.png">
<style>
  :root {
    --bg: #0a0e16;
    --panel: #131a27;
    --panel-2: #0f1521;
    --line: #232e42;
    --cell: #1a2333;
    --text: #e8edf6;
    --muted: #7c89a0;
    --accent: #4c8dff;
    --accent-hi: #86b3ff;
    --accent-soft: rgba(76, 141, 255, .22);
    --danger: #e5484d;
    --amber: #e0a23a;
    --green: #1f9d55;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --side: 236px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  button, input, select, textarea { font-family: inherit; }
  h1, h2, h3, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- gate (loading, no session, no access) */
  #gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .gate-card { width: min(100%, 400px); background: var(--panel-2); border: 1px solid var(--line); border-radius: 22px; padding: 24px; }
  .gate-card img { height: 56px; width: auto; display: block; margin-bottom: 16px; }
  .gate-card h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 6px; }
  .gate-card p { color: var(--muted); font-size: 14px; margin-bottom: 18px; overflow-wrap: anywhere; }
  .gate-card p b { color: var(--text); font-weight: 600; }
  .gate-actions { display: grid; gap: 8px; }

  /* ---------------------------------------------------------------- buttons */
  .btn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 650; cursor: pointer;
    transition: transform 140ms var(--ease-out), opacity 200ms ease, background-color 200ms ease, border-color 200ms ease;
  }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn.alt { background: var(--panel); border-color: var(--line); color: var(--text); }
  .btn.danger { background: transparent; border-color: rgba(229, 72, 77, .5); color: #ff8a8d; }
  .btn.danger.armed, .btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.sm { min-height: 44px; font-size: 13.5px; padding: 0 14px; }
  .pill {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); white-space: nowrap;
    min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease, color 200ms ease;
  }
  .pill:active { transform: scale(.97); }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill.ghost { background: transparent; color: var(--muted); }
  .pill[aria-pressed="true"] { background: var(--accent-soft); border-color: rgba(76, 141, 255, .55); color: #cfe0ff; }
  .pill .count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
  .pill[aria-pressed="true"] .count { color: #a9c8ff; }
  @media (hover: hover) and (pointer: fine) {
    .pill:hover { border-color: #34435f; }
    .btn.alt:hover { border-color: #34435f; }
    .nav button:hover { background: var(--panel); color: var(--text); }
    .urow:hover, table.rt tbody tr.click:hover { background: rgba(76, 141, 255, .06); }
    th.sortable:hover { color: var(--text); }
  }

  /* ---------------------------------------------------------------- shell */
  #shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100dvh; }
  .side {
    position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 18px;
    padding: 22px 14px 16px; border-right: 1px solid var(--line); background: #0c111b;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand img { height: 26px; width: auto; display: block; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .brand span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #a9c8ff; background: var(--accent-soft); padding: 3px 7px; border-radius: 6px; }
  .nav { display: grid; gap: 2px; }
  .nav button {
    appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
    transition: transform 140ms var(--ease-out), background-color 200ms ease, color 200ms ease;
  }
  .nav button:active { transform: scale(.97); }
  .nav button svg { width: 18px; height: 18px; flex: none; }
  .nav button[aria-current="page"] { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .nav button[aria-current="page"] svg { color: var(--accent); }
  .side-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 4px; }
  .side-foot .who { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; padding: 0 6px; }
  .side-foot .who b { display: block; color: var(--text); font-weight: 600; font-size: 12.5px; }

  .main { min-width: 0; padding: 26px clamp(16px, 3vw, 36px) 60px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .topbar h1 { font-size: 24px; font-weight: 680; letter-spacing: -.02em; }
  .topbar .sub { color: var(--muted); font-size: 13px; width: 100%; margin-top: -8px; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .stamp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mhead { display: none; }
  #view { transition: opacity 200ms ease; }
  #view.is-loading { opacity: .55; }

  /* ---------------------------------------------------------------- cards and grids */
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .card-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .card-head .hint { font-size: 12.5px; color: var(--muted); }
  .card-head .total { margin-left: auto; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; vertical-align: middle; }

  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .kpi .l { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .kpi .v { font-size: 26px; font-weight: 680; letter-spacing: -.02em; line-height: 1.15; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .kpi.hero { grid-column: span 2; grid-row: span 2; justify-content: space-between; background: linear-gradient(160deg, #16223a, var(--panel) 70%); }
  .kpi.hero .v { font-size: clamp(40px, 5vw, 54px); }
  .kpi.wide { grid-column: span 2; }
  .kpi .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.green { background: var(--green); } .dot.amber { background: var(--amber); } .dot.red { background: var(--danger); } .dot.blue { background: var(--accent); } .dot.gray { background: #46536b; }

  /* state badges: status color always ships with a label */
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; white-space: nowrap; background: #1b2434; color: #c5cfdf; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #46536b; }
  .badge.trial::before { background: var(--accent); }
  .badge.paid::before, .badge.life::before { background: var(--green); }
  .badge.soon::before { background: var(--amber); }
  .badge.over::before, .badge.blocked::before { background: var(--danger); }

  /* ---------------------------------------------------------------- funnel (rows on phone, columns on desktop) */
  .funnel { display: grid; gap: 12px; }
  .fstep { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
  .fstep .fl { font-size: 13px; color: var(--muted); }
  .fstep .fv { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .fstep .fbar { grid-column: 1 / -1; height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); width: var(--p); min-width: 2px; }
  .fstep .fbar.zero { background: var(--cell); width: 100%; border-radius: 4px; height: 4px; }
  .fstep .fd { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (min-width: 900px) {
    .funnel { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; align-items: end; }
    .fstep { grid-template-columns: 1fr; grid-template-rows: auto 130px auto auto; gap: 6px; text-align: left; border-left: 1px solid var(--line); padding-left: 10px; }
    .fstep .fv { order: 1; text-align: left; font-size: 20px; }
    .fstep .fcol { order: 2; display: flex; align-items: flex-end; height: 130px; }
    .fstep .fbar { width: 24px; height: var(--p); min-height: 2px; border-radius: 4px 4px 0 0; }
    .fstep .fbar.zero { width: 24px; height: 2px; border-radius: 0; }
    .fstep .fl { order: 3; font-size: 12.5px; line-height: 1.3; min-height: 2.6em; }
    .fstep .fd { order: 4; min-height: 1.4em; }
  }
  @media (max-width: 899px) { .fstep .fcol { display: contents; } }

  /* ---------------------------------------------------------------- charts */
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; font-family: inherit; }
  .chart .lbl { fill: var(--text); font-weight: 650; font-size: 12px; }
  .chart .grid-l { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .bar { fill: var(--accent); }
  .chart .bar.on { fill: var(--accent-hi); }
  .chart .cell { transition: stroke 120ms ease; stroke: transparent; stroke-width: 1.5; }
  .chart .cell.on { stroke: #dfe9ff; }
  .empty { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 8px 8px 4px; }
  .empty svg { width: min(100%, 260px); height: auto; display: block; margin-bottom: 6px; }
  .empty b { font-size: 13.5px; font-weight: 650; }
  .empty span { font-size: 12.5px; color: var(--muted); max-width: 34ch; }
  #tip {
    position: fixed; z-index: 50; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity 120ms ease;
    background: #232e42; border: 1px solid #34435f; border-radius: 10px; padding: 7px 10px; box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .7);
    font-size: 12px; color: var(--muted); max-width: 240px;
  }
  #tip.show { opacity: 1; }
  #tip b { display: block; color: var(--text); font-size: 14px; font-weight: 680; font-variant-numeric: tabular-nums; }

  /* entrance motion: only transform, opacity and stroke-dashoffset */
  .anim .gy { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(var(--from, 0)); }
  .anim .gx { transform-origin: 0 50%; transform: scaleX(var(--from, 0)); }
  .anim.in .gy, .anim.in .gx { transform: none; transition: transform 420ms var(--ease-out) var(--d, 0ms), fill 120ms ease, background-color 120ms ease, opacity 160ms ease; }
  .anim .ln { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .anim.in .ln { stroke-dashoffset: 0; transition: stroke-dashoffset 800ms var(--ease-out); }
  .anim .ar, .anim .pt, .anim .fd { opacity: 0; }
  .anim.in .ar { opacity: 1; transition: opacity 600ms ease 250ms; }
  .anim.in .pt { opacity: 1; transition: opacity 300ms ease 600ms; }
  .anim.in .fd { opacity: 1; transition: opacity 320ms ease var(--d, 0ms), stroke 120ms ease; }
  .anim .arc { stroke-dashoffset: var(--len); }
  .anim.in .arc { stroke-dashoffset: 0; transition: stroke-dashoffset 800ms var(--ease-out); }
  .anim .cover { stroke-dashoffset: 0; }
  .anim.in .cover { stroke-dashoffset: var(--c); transition: stroke-dashoffset 800ms var(--ease-out); }
  .anim .bub { transform-box: fill-box; transform-origin: center; transform: scale(.6); opacity: 0; }
  .anim.in .bub { transform: none; opacity: 1; transition: transform 420ms var(--ease-out) var(--d, 0ms), opacity 300ms ease var(--d, 0ms), fill 120ms ease; }
  .anim.in .bub.dim { opacity: .18; }
  .anim .fb { transform-origin: 0 50%; transform: scaleX(var(--from, 0)); }
  .anim.in .fb { transform: none; transition: transform 460ms var(--ease-out) var(--d, 0ms); }
  @media (min-width: 900px) { .anim .fb { transform-origin: 50% 100%; transform: scaleY(var(--from, 0)); } }
  @media (prefers-reduced-motion: reduce) { .anim *, .anim.in * { transition: none !important; } }
  .chart .bar.dim, .hbar.dim, .drow.dim, .donut .seg.dim { opacity: .3; }
  .hbars.pick .hbar, .hbar { cursor: pointer; }
  .hbar.sel .hl { color: #cfe0ff; }

  .vrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .sparkbox { flex: none; width: 96px; max-width: 45%; }
  .spark { display: block; width: 100%; height: auto; overflow: visible; }
  .dlt { font-size: 12px; color: var(--muted); }
  .dlt b { font-weight: 650; }
  .dlt.good b { color: #4cc38a; } .dlt.bad b { color: #ff8a8d; } .dlt.flat b { color: #aab4c5; }
  .fchip { display: inline-flex; align-items: center; gap: 10px; align-self: start; justify-self: start; font-size: 13px; color: #cfe0ff; background: var(--accent-soft); border: 1px solid rgba(76, 141, 255, .5); border-radius: 999px; padding: 0 4px 0 14px; }
  .fchip .pill { min-height: 44px; margin: 0; background: transparent; border-color: transparent; color: #cfe0ff; }
  .donut { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr); gap: 18px; align-items: center; }
  .dring { position: relative; }
  .dring svg { display: block; width: 100%; height: auto; }
  .donut .seg { transition: opacity 160ms ease, stroke-width 160ms ease; }
  .donut .seg.on { opacity: .82; }
  .dcenter { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dcenter b { font-size: 24px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1; }
  .dcenter span { font-size: 11.5px; color: var(--muted); }
  .dlegend { display: grid; gap: 2px; }
  .drow { appearance: none; background: none; border: 0; color: var(--text); font: inherit; cursor: pointer; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 40px; gap: 8px; align-items: center; min-height: 44px; padding: 0 6px; border-radius: 10px; text-align: left; transition: opacity 160ms ease, background-color 160ms ease; }
  .drow i { width: 10px; height: 10px; border-radius: 2px; }
  .drow .dl { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow b { font-size: 13.5px; font-weight: 650; }
  .drow .dp { font-size: 12px; color: var(--muted); text-align: right; }
  .drow.sel { background: rgba(76, 141, 255, .1); }
  @media (hover: hover) and (pointer: fine) { .drow:hover { background: rgba(76, 141, 255, .06); } }
  @media (max-width: 420px) { .donut { grid-template-columns: 1fr; } .dring { max-width: 170px; margin: 0 auto; } }

  .hbars { display: grid; grid-template-columns: minmax(28px, max-content) 1fr max-content; gap: 10px; }
  .hbar { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; min-height: 24px; outline: none; border-radius: 6px; }
  .hbar:focus-visible { box-shadow: 0 0 0 2px var(--accent-soft); }
  .hbar .hl { font-size: 13px; color: var(--text); font-weight: 600; max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .ht { height: 12px; position: relative; }
  .hbar .hf { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p); min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
  .hbar.on .hf { background: var(--accent-hi); }
  .hbar .hv { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .hbar .hv b { color: var(--text); font-weight: 650; }

  .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .gauge { text-align: center; position: relative; }
  .gauge svg { width: 100%; max-width: 170px; height: auto; display: block; margin: 0 auto; }
  .gauge .gv { font-size: 22px; font-weight: 680; letter-spacing: -.02em; margin-top: -30px; height: 30px; line-height: 30px; }
  .gauge .gv.none { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .gauge .gl { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .gauge .gl b { color: var(--text); font-weight: 650; }
  .scale { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .scale i { width: 14px; height: 10px; border-radius: 2px; background: var(--accent); display: block; }

  .seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); min-height: 44px; min-width: 60px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 650; cursor: pointer; transition: background-color 200ms ease, color 200ms ease, transform 140ms var(--ease-out); }
  .seg button:active { transform: scale(.97); }
  .seg button[aria-pressed="true"] { background: #232e42; color: var(--text); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .chart .grp { transition: opacity 120ms ease; }
  .chart .grp.on { opacity: .78; }
  #tip .trs { display: grid; gap: 2px; margin-top: 2px; }
  #tip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #tip .tr i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  #tip .tr b { display: inline; font-size: 12.5px; margin-left: auto; padding-left: 14px; }
  .mapgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .map svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .map .land { fill: #182132; stroke: #2c3a54; stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .map .bub { fill: rgba(76, 141, 255, .34); stroke: #4c8dff; stroke-width: 1.5; vector-effect: non-scaling-stroke; transition: fill 120ms ease; }
  .map .bub.on { fill: rgba(134, 179, 255, .62); }
  .kpis.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .sec-title { font-size: 17px; font-weight: 680; letter-spacing: -.01em; margin-top: 8px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 14px; font-size: 12.5px; color: var(--muted); }
  .pill[disabled] { opacity: .45; cursor: default; }
  .twol { display: inline-grid; gap: 1px; }
  .twol small { font-size: 12px; color: var(--muted); }
  button.linkcell { appearance: none; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; min-height: 44px; }
  .help.warn { color: #f0c479; }
  .rule { display: grid; gap: 12px; align-content: start; }
  .rule.off .msgprev { opacity: .6; }
  .rule-name { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .rule-when { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rule-meta { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
  .rule-count { font-size: 12.5px; color: var(--muted); }
  .rule-count b { color: var(--text); font-weight: 650; }
  .msgprev { display: flex; align-items: center; gap: 12px; background: #1b2434; border: 1px solid #2c3a54; border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 26px -14px rgba(0, 0, 0, .8); }
  .msgprev .msgtxt { min-width: 0; flex: 1; }
  .msgprev b { display: block; font-size: 13.5px; font-weight: 650; overflow-wrap: anywhere; }
  .msgprev b.ph { color: var(--muted); font-weight: 600; }

/* ------------------------------------------------------------------ license state (derived on the client) */
function lic(u) {
  const now = Date.now();
  const exp = u.expires_at ? new Date(u.expires_at).getTime() : null;
  const left = exp == null ? null : Math.ceil((exp - now) / DAY);
  const lifetime = exp != null && exp > now + LIFETIME_MS;
  const expired = exp == null || exp <= now;
  const paid = !lifetime && !expired && u.plan === 'mensal';
  const trial = !lifetime && !expired && u.plan === 'teste';
  let key = 'none', label = 'Sem licença', cls = 'over';
  if (u.blocked) { key = 'blocked'; label = 'Bloqueado'; cls = 'blocked'; }
  else if (lifetime) { key = 'life'; label = u.plan === 'admin' ? 'Admin vitalício' : 'Vitalício'; cls = 'life'; }
  else if (expired) { key = 'expired'; label = 'Vencido'; cls = 'over'; }
  else if (paid) { key = 'paid'; label = 'Assinante'; cls = left <= 3 ? 'soon' : 'paid'; }
  else if (trial) { key = 'trial'; label = 'Em teste'; cls = left <= 3 ? 'soon' : 'trial'; }
  else { key = 'other'; label = 'Ativo'; cls = 'paid'; }
  return { key, label, cls, exp, left, lifetime, expired, paid, trial, blocked: !!u.blocked };
}
function expiresIn(u, days) {                          // active, not lifetime, expiring within N days
  const l = lic(u);
  return !l.blocked && !l.lifetime && !l.expired && l.exp - Date.now() <= days * DAY;
}
function leftText(l) {
  if (l.lifetime) return 'sem vencimento';
  if (l.exp == null) return 'sem data';
  if (l.expired) return 'venceu ' + ago(l.exp);
  if (dayKey(l.exp) === dayKey(Date.now())) return 'vence hoje';
  if (l.exp - Date.now() < DAY) return 'vence amanhã';
  return 'vence em ' + plural(l.left, 'dia', 'dias');
}
function summary() {
  const users = D.users || [];
  const now = Date.now();
  const c = { total: users.length, new7: 0, new30: 0, trial: 0, paid: 0, expired: 0, expiredTrial: 0, blocked: 0, life: 0, soon7: 0 };
  for (const u of users) {
    const l = lic(u);
    const age = now - new Date(u.created_at).getTime();
    if (age <= 7 * DAY) c.new7++;
    if (age <= 30 * DAY) c.new30++;
    if (l.blocked) c.blocked++;
    if (l.trial && !l.blocked) c.trial++;
    if (l.paid && !l.blocked) c.paid++;
    if (l.lifetime) c.life++;
    if (l.expired && !l.lifetime) { c.expired++; if (u.plan === 'teste') c.expiredTrial++; }
    if (expiresIn(u, 7)) c.soon7++;
  }
  c.mrr = c.paid * price();
  c.conv = (c.paid + c.expiredTrial) ? 100 * c.paid / (c.paid + c.expiredTrial) : null;
  return c;
}

/* ------------------------------------------------------------------ KPI tiles: count-up, change vs previous period, sparkline */
const counters = [];
// the final text is written first, so a frozen rAF (hidden tab) still shows the right number
function countUp(el, to, fmt) { el.textContent = fmt(to); if (isFinite(to) && to !== 0) counters.push({ el, to, fmt }); }
function runCounters() {
  const list = counters.splice(0);
  if (REDUCED.matches || !list.length || document.visibilityState !== 'visible') return;
  const t0 = performance.now(), D_MS = 700;
  const step = now => {
    const k = Math.min(1, (now - t0) / D_MS), e = 1 - Math.pow(1 - k, 3);
    list.forEach(c => { if (c.el.isConnected) c.el.textContent = c.fmt(k === 1 ? c.to : (Number.isInteger(c.to) ? Math.round(c.to * e) : c.to * e)); });
    if (k < 1) requestAnimationFrame(step);

}
function sparkline(values) {

  const W = 96, H = 30, max = Math.max(...vals), min = Math.min(...vals, 0);
  const x = i => 2 + i * (W - 6) / (vals.length - 1), y = v => H - 3 - (max === min ? 0 : (v - min) / (max - min)) * (H - 8);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const svg = s('svg', { class: 'spark', viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' },
    s('path', { class: 'ln', d, pathLength: 1, fill: 'none', stroke: '#4c8dff', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }),
    s('circle', { class: 'pt', cx: x(vals.length - 1), cy: y(vals[vals.length - 1]), r: 2.6, fill: '#4c8dff' }));
  const box = h('span', { class: 'sparkbox' }, svg);

}

function multiChart(points, series, opts = {}) {
  if (!points.length || points.every(p => p.values.every(v => !v))) return emptyChart(opts.emptyText);
  const fmt = opts.fmt || nf;
  const wrap = h('div');
  wrap.append(h('div', { class: 'legend' }, series.map(sr => h('span', null, h('i', { style: 'background:' + sr.color }), sr.name))));
  const el = mount(w => {
    const H = opts.height || 200, mL = 36, mR = 8, mT = 14, mB = 24;
    const iw = Math.max(40, w - mL - mR), ih = H - mT - mB, n = points.length, k = series.length;
    const tops = points.map(p => opts.stacked ? p.values.reduce((a, v) => a + v, 0) : Math.max(...p.values));
    const { top, ticks } = niceScale(Math.max(...tops));

    const yAt = v => mT + ih - (v / top) * ih;
    const svg = s('svg', { viewBox: `0 0 ${w} ${H}`, role: 'img', 'aria-label': opts.aria || 'Gráfico' });

      svg.append(s('line', { class: 'grid-l', x1: mL, x2: w - mR, y1: yAt(t), y2: yAt(t) }));
      svg.append(s('text', { x: mL - 8, y: yAt(t) + 4, 'text-anchor': 'end' }, nf(t)));
    });
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 58))));
    points.forEach((p, i) => { if ((n - 1 - i) % every === 0) svg.append(s('text', { x: mL + band * (i + .5), y: H - 6, 'text-anchor': 'middle' }, p.label)); });
    const bar = (x, y, bw, y0, round) => {
      const r = round ? Math.min(4, bw / 2, y0 - y) : 0;
      return `M${x} ${y0} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + bw - r} Q${x + bw} ${y} ${x + bw} ${y + r} V${y0} Z`;
    };
    const groups = points.map((p, i) => {
      const g = s('g', { class: 'grp' });
      const dly = stagger(i, n);
      const cx = mL + band * (i + .5);
      if (opts.stacked) {
        const bw = Math.max(2, Math.min(24, band - 2));
        let acc = 0;
        const lastIdx = p.values.reduce((a, v, j) => v ? j : a, -1);
        p.values.forEach((v, j) => {
          if (!v) return;
          const y0 = yAt(acc) - (acc ? 2 : 0), y = Math.min(yAt(acc + v), y0 - 1);   // 2px surface gap between segments
          g.append(s('path', { class: 'gy', style: `--d:${dly}`, d: bar(cx - bw / 2, y, bw, y0, j === lastIdx), fill: series[j].color }));
          acc += v;
        });
      } else {
        const bw = Math.max(2, Math.min(20, (band - 4) / k - 2));
        const total = k * bw + (k - 1) * 2;
        p.values.forEach((v, j) => {
          if (!v) return;
          const y0 = yAt(0), y = Math.min(yAt(v), y0 - 2);
          g.append(s('path', { class: 'gy', style: `--d:${dly}`, d: bar(cx - total / 2 + j * (bw + 2), y, bw, y0, true), fill: series[j].color }));
        });

      svg.append(g);
      return g;
    });
    const hit = s('rect', { x: mL, y: 0, width: iw + mR, height: H, fill: 'transparent' });
    let cur = -1;
    const move = ev => {
      const box = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.floor(((ev.clientX - box.left) * (w / box.width) - mL) / band)));
      if (i !== cur) { if (groups[cur]) groups[cur].classList.remove('on'); cur = i; groups[i].classList.add('on'); }
      const rows = series.map((sr, j) => ({ color: sr.color, name: sr.name, value: fmt(points[i].values[j]) }));
      if (opts.stacked) rows.push({ name: 'Total', value: fmt(tops[i]) });
      showTip(ev.clientX, ev.clientY, points[i].tip || points[i].label, tipRows(rows));
    };
    const leave = () => { if (groups[cur]) groups[cur].classList.remove('on'); cur = -1; hideTip(); };
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', lazyOff(leave)); hit.addEventListener('pointercancel', leave);
    svg.append(hit);
    return svg;
  });
  motion(el, opts.id, points.flatMap(p => p.values));
  wrap.append(el);
  return wrap;
}

/* ------------------------------------------------------------------ revenue BI, all derived on the client from admin_users + license_log */
function bi() {
  const P = price(), now = Date.now();
  const users = D.users || [], byId = new Map(users.map(u => [u.id, u]));
  // a payment is a log row written by "Registrar pagamento"
  const pays = (D.log || []).filter(r => r.action === 'pagamento mensal' && r.user_id).map(r => {
    const at = new Date(r.created_at).getTime();
    return { user: r.user_id, email: r.user_email, admin: r.admin_email, at, exp: r.new_expires ? new Date(r.new_expires).getTime() : at + 30 * DAY };
  }).sort((a, b) => a.at - b.at);
  const byUser = new Map();
  pays.forEach(p => { if (!byUser.has(p.user)) byUser.set(p.user, []); byUser.get(p.user).push(p); });

  const months = lastMonths(12);
  const per = new Map(months.map(k => [k, { pays: 0, news: 0, renew: 0, cancel: 0, active: 0, payers: new Set() }]));
  const bump = (k, f) => { const m = per.get(k); if (m) m[f]++; };
  byUser.forEach((list, uid) => list.forEach((p, i) => {
    const k = monthKey(p.at);
    bump(k, 'pays'); bump(k, i ? 'renew' : 'news');
    if (per.has(k)) per.get(k).payers.add(uid);
    // cancellation: the paid period ended more than 3 days ago and nothing was paid before that cut
    const next = list[i + 1], cut = p.exp + 3 * DAY;
    if (cut >= now || (next && next.at <= cut)) return;
    const u = byId.get(uid);
    if (!next && u && !lic(u).expired) return;           // extended some other way (courtesy days, lifetime): still a customer
    bump(monthKey(cut), 'cancel');
  }));
  // monthly accounts that lapsed without any payment in the log (set by hand before payments were recorded)
  users.forEach(u => {
    if (u.plan !== 'mensal' || byUser.has(u.id)) return;
    const l = lic(u);
    if (l.expired && l.exp && l.exp + 3 * DAY < now) bump(monthKey(l.exp + 3 * DAY), 'cancel');
  });
  months.forEach(k => {
    const a = monthStart(k), b = monthStart(monthAfter(k));
    let n = 0;
    byUser.forEach(list => { if (list.some(p => p.at < b && p.exp >= a)) n++; });
    per.get(k).active = n;
  });

  const c = summary();
  const cur = months[11], prev = months[10];
  const M = per.get(cur), M0 = per.get(prev);
  let base = 0;
  byUser.forEach(list => { if (list.some(p => p.at < monthStart(cur) && p.exp >= monthStart(cur))) base++; });
  if (!base) base = c.paid + M.cancel - M.news;
  const churn = base > 0 ? 100 * M.cancel / base : null;
  const revenue = M.pays * P, revenue0 = M0.pays * P;
  const ticket = M.payers.size ? revenue / M.payers.size : P;
  const waits = [];
  byUser.forEach((list, uid) => { const u = byId.get(uid); if (u) waits.push(Math.max(0, (list[0].at - new Date(u.created_at).getTime()) / DAY)); });
  return {
    P, pays, byUser, months, per, c, M, M0, churn, revenue, revenue0, ticket,
    mrr: c.paid * P,
    ltv: churn ? ticket / (churn / 100) : null,
    delta: revenue0 > 0 ? 100 * (revenue - revenue0) / revenue0 : null,
    wait: waits.length ? waits.reduce((a, v) => a + v, 0) / waits.length : null,
  };
}

async function signOut() {
  if (S.demo) return toast('Modo demonstração.');

let booting = false;
async function boot() {
  if (booting || S.demo) return;
  booting = true;
  try {
    if (!window.supabase) {
      gate('Não carregou', 'A biblioteca de conexão não abriu. Confira a internet.', h('button', { class: 'btn', type: 'button', onclick: () => location.reload() }, 'Tentar de novo'));
      return;
    }
    if (!sb) {
      sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
      let lastUser;
      // never call Supabase inside this callback: defer with setTimeout 0
      sb.auth.onAuthStateChange((_event, session) => {
        const uid = session?.user?.id || null;
        if (lastUser !== undefined && uid !== lastUser) setTimeout(boot, 0);
        lastUser = uid;
        if (session) S.session = session;
      });
    }
    gate('Abrindo o painel', 'Conferindo o seu acesso.', null, true);
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    S.session = data.session;
    if (!S.session) {
      gate('Entre no app primeiro', 'O painel usa o mesmo login do King Pad. Entre no app e volte para esta página.', [
        h('a', { class: 'btn', href: '../app/' }, 'Abrir o app'),
        h('button', { class: 'btn alt', type: 'button', onclick: boot }, 'Já entrei, tentar de novo')]);
      return;
    }
    const adm = await sb.rpc('is_admin');
    if (adm.error) throw adm.error;
    if (adm.data !== true) {
      const card = $('#gateCard');
      gate('Sem acesso', '', [
        h('button', { class: 'btn', type: 'button', onclick: async () => { try { await sb.auth.signOut(); } catch (_) {} boot(); } }, 'Sair'),
        h('a', { class: 'btn alt', href: '../app/' }, 'Voltar para o app')]);
      card.querySelector('p').replaceChildren('A conta ', h('b', null, S.session.user.email), ' não é administradora do King Pad.');
      return;
    }
    enterPanel();
    load();
  } catch (err) {
    gate('Não abriu', explain(err), h('button', { class: 'btn', type: 'button', onclick: boot }, 'Tentar de novo'));
  } finally {
    booting = false;
  }
}

      else if (r < .34) { plan = 'mensal'; exp = now + (rnd() * 34 - 3) * DAY; }

    });
    const hours = [];
    for (let d = 0; d < 7; d++) for (let hr = 6; hr < 24; hr++) { const w = (d === 0 ? 3 : d === 3 ? 1.6 : d === 6 ? 1.4 : .5) * (hr >= 18 && hr <= 21 ? 2.4 : hr >= 8 && hr <= 11 && d === 0 ? 3 : .6); const m = Math.floor(rnd() * 60 * w); if (m > 4) hours.push({ dow: d, hour: hr, minutes: m }); }
