<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pads">
<title>Pads</title>
<style>
  :root {
    --bg: #0a0e16;
    --panel: #131a27;
    --line: #232e42;
    --text: #e8edf6;
    --muted: #7c89a0;
    --accent: #4c8dff;
    --accent-soft: rgba(76, 141, 255, .22);
    --danger: #e5484d;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  button { font-family: inherit; }

  .app {
    height: 100dvh;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);
  }

  header { display: flex; align-items: center; gap: 12px; padding: 0 2px; }
  header h1 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
  #status { font-size: 13px; color: var(--muted); margin-right: auto; }
  #status b { color: var(--text); font-weight: 600; }
  #offlineInfo { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: transform 140ms var(--ease-out), background-color 200ms ease;
  }
  .pill:active { transform: scale(.96); }
  .pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill.ghost { background: transparent; color: var(--muted); }
  .power {
    appearance: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px 0 13px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font-size: 13px; font-weight: 700; letter-spacing: .04em; cursor: pointer; min-width: 84px;
    transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease, color 200ms ease, box-shadow 200ms ease;
  }
  .power:active { transform: scale(.95); }
  .power[aria-pressed="true"] { background: #1f9d55; border-color: #1f9d55; color: #fff; box-shadow: 0 0 0 4px rgba(31, 157, 85, .22); }

  /* Mixer: vertical faders + master */
  .faders { display: grid; grid-template-columns: repeat(var(--stems), 1fr) 14px 1.1fr; gap: 9px; min-height: 0; }
  .faders .sep { width: 1px; background: var(--line); justify-self: center; margin: 8px 0; }
  .fader {
    position: relative; overflow: hidden; border-radius: 18px; min-height: 0;
    background: var(--panel); border: 1px solid var(--line);
    touch-action: none; cursor: ns-resize; outline: none;
    transition: opacity 200ms ease, border-color 200ms ease;
  }
  .fader:focus-visible { border-color: var(--accent); }
  .fader.dragging { border-color: #3a4a68; }
  .fill {
    position: absolute; inset: 0; transform-origin: center bottom; transform: scaleY(.8);
    background: linear-gradient(0deg, #26385c, #3d6fd0);
    transition: opacity 200ms ease;
    will-change: transform;
  }
  .fader.muted .fill { opacity: .22; }
  .fader.missing { opacity: .4; }
  .fader.master .fill { background: linear-gradient(0deg, #56627a, #dfe6f3); }

  .chip {
    position: absolute; left: 50%; bottom: 8px; translate: -50% 0; z-index: 2;
    width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer;
    background: rgba(8, 12, 20, .6); color: var(--text); font-size: 16px; font-weight: 700;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: transform 140ms var(--ease-out), background-color 200ms ease;
  }
  .chip:active { transform: scale(.92); }
  .fader.muted .chip { background: var(--danger); color: #fff; }
  .fader.master .chip { background: rgba(8, 12, 20, .72); cursor: default; }
  .pct {
    position: absolute; left: 0; right: 0; top: 10px; z-index: 2; pointer-events: none; text-align: center;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .88);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .55);
  }

  /* Keys row */
  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 9px; height: 62px; }
  .key {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 16px; cursor: pointer; min-width: 0;
    display: flex; align-items: baseline; justify-content: center; gap: 6px; padding-top: 18px;
    transition: transform 140ms var(--ease-out), background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, opacity 200ms ease;
  }
  .key strong { font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .key span { font-size: 11px; color: var(--muted); transition: color 200ms ease; }
  .key:active { transform: scale(.95); }
  .key[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 10px 28px -8px rgba(76, 141, 255, .7);
  }
  .key[aria-pressed="true"] span { color: rgba(255, 255, 255, .8); }
  .key.empty { opacity: .35; }
  .key.idle { background: var(--panel); border-color: var(--accent); box-shadow: none; }
  .key.idle span { color: var(--muted); }

  /* Auth screen */
  #auth {
    position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
    display: grid; place-items: center; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    user-select: text; -webkit-user-select: text;
  }
  .auth-card { width: min(100%, 380px); background: #0f1521; border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
  .auth-card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .auth-card p.sub { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--panel); border-radius: 12px; margin-bottom: 14px; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); height: 34px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color 200ms ease, color 200ms ease; }
  .seg button[aria-selected="true"] { background: #232e42; color: var(--text); }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 0 12px; font: inherit; font-size: 16px; outline: none; transition: border-color 200ms ease;
  }
  .field input:focus { border-color: var(--accent); }
  .btn {
    appearance: none; width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 650; cursor: pointer; margin-top: 4px;
    transition: transform 140ms var(--ease-out), opacity 200ms ease;
  }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .6; }
  .btn.alt { background: var(--panel); border-color: var(--line); color: var(--text); display: flex; align-items: center; justify-content: center; gap: 9px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 14px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #authMsg { min-height: 18px; margin: 10px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
  #authMsg.err { color: #ff8a8d; }
  #authMsg.ok { color: #6fd29a; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 86px); z-index: 10;
    translate: -50% 0; max-width: min(88vw, 440px); padding: 11px 16px; border-radius: 14px;
    background: #232e42; color: var(--text); font-size: 13.5px; line-height: 1.35; text-align: center;
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, .6);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 200ms ease, transform 240ms var(--ease-out);
  }
  #toast.show { opacity: 1; transform: none; }

  @media (max-height: 420px) {
    .app { gap: 8px; }
    .keys { height: 54px; }
    .key { padding-top: 14px; }
  }
  @media (max-width: 520px) {
    .faders, .keys { gap: 6px; }
    .key { flex-direction: column; align-items: center; gap: 1px; padding-top: 10px; }
    .chip { width: 34px; height: 34px; border-radius: 10px; font-size: 14px; }
    .pct { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .key, .chip, .pill, #toast, dialog { transition-property: opacity, background-color, border-color; }
  }
</style>
</head>
<body>
<div id="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <h2>Pads</h2>
    <p class="sub" id="authSub">Entre para tocar.</p>
    <div class="seg" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">Entrar</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">Criar conta</button>
    </div>
    <label class="field" id="nameField" hidden><span>Nome</span><input id="authName" type="text" autocomplete="name"></label>
    <label class="field"><span>E-mail</span><input id="authEmail" type="email" autocomplete="email" inputmode="email" required></label>
    <label class="field"><span>Senha</span><input id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="btn" id="authSubmit" type="submit">Entrar</button>
    <div id="ssoBlock" hidden>
      <div class="or">ou</div>
      <button class="btn alt" id="googleBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
        Entrar com Google
      </button>
    </div>
    <p id="authMsg" role="status" aria-live="polite"></p>
  </form>
</div>
<div class="app">
  <header>
    <h1>Pads</h1>
    <div id="status">Carregando…</div>
    <span id="offlineInfo"></span>
    <button class="pill ghost" id="logout">Sair</button>
    <button class="power" id="power" aria-pressed="false" aria-label="Ligar ou desligar o som">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg>
      <span id="powerLabel">OFF</span>
    </button>
  </header>
  <div class="faders" id="faders"></div>
  <div class="keys" id="keys"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- Config ---------- */
// Stems live in the Supabase Storage bucket "pads" as <KEY>/<1..4> (public read, only ADMIN can write).
const CFG = {
  supabaseUrl: 'https://enytnepolxsyabsxdxyn.supabase.co',
  supabaseKey: 'sb_publishable_uu8BHH9W8FIZ5IylFURbyw_iOaOi40P',   // publishable key, safe in the browser
  bucket: 'pads',
  // Semitone correction per stem. "D/2": the CAM 2 file delivered in the D folder was recorded in C.
  transpose: { 'D/2': 2 },
  google: false,    // flip to true once the Google provider is enabled in Supabase Auth
  stems: 4,
  fade: 0.9,        // seconds, fade-in of the new key
  fadeOut: 1.6,     // seconds, fade-out of the previous key and on stop
  loopFade: 4,      // seconds, crossfade at the loop point (capped at 25% of the track)
};
const BUILD = '2026-09-20.9';   // keep equal to version.txt; a different value there forces clients to reload
const KEYS = [['C', 'Dó'], ['D', 'Ré'], ['E', 'Mi'], ['F', 'Fá'], ['G', 'Sol'], ['A', 'Lá'], ['B', 'Si']];
const STORE = 'pads.v2';
const AUDIO_RE = /^(?!\.).*\.(mp3|wav|m4a|aac|ogg)$/i;   // skips macOS "._" sidecar files

/* ---------- State ---------- */
const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } })();
const fit = (arr, fillWith) => Array.from({ length: CFG.stems }, (_, i) => arr?.[i] ?? fillWith);
const state = {
  levels: fit(saved.levels, .8),
  mutes: fit(saved.mutes, false),
  master: saved.master ?? .8,
  key: saved.key ?? null,   // selected key
  on: false,                // sound on/off
};
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ levels: state.levels, mutes: state.mutes, master: state.master, key: state.key })); } catch {} };

const library = {};     // key -> [url | null] per stem
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
let user = null;
let libraryReady = false;
const $ = (s) => document.querySelector(s);
const statusEl = $('#status');
document.documentElement.style.setProperty('--stems', CFG.stems);

/* ---------- Audio engine ---------- */
let ctx, masterGain, stemGains = [], pairs = [], wakeLock = null;

function ensureAudio() {
  if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}  // iOS: play even with the mute switch on
  const AC = window.AudioContext || window.webkitAudioContext;
  try { ctx = new AC({ sampleRate: 44100, latencyHint: 'playback' }); } catch { ctx = new AC(); }   // same rate as the stems: no resampling drift
  masterGain = ctx.createGain();
  masterGain.connect(ctx.destination);
  for (let i = 0; i < CFG.stems; i++) {
    const g = ctx.createGain();
    g.connect(masterGain);
    stemGains.push(g);
  }
  applyGains(true);
}

const curve = (v) => v * v;
function applyGains(instant) {
  if (!ctx) return;
  const set = (param, v) => instant ? param.setValueAtTime(v, ctx.currentTime) : param.setTargetAtTime(v, ctx.currentTime, .02);
  set(masterGain.gain, curve(state.master));
  stemGains.forEach((g, i) => set(g.gain, state.mutes[i] ? 0 : curve(state.levels[i])));
}

function ramp(param, to, seconds) {
  const t = ctx.currentTime;
  param.cancelScheduledValues(t);
  param.setValueAtTime(param.value, t);
  param.linearRampToValueAtTime(to, t + seconds);
}

// One set of synced <audio> elements (streamed, so long files don't blow up phone memory).
class Voice {
  constructor(urls, key) {
    this.gen = 0;
    this.key = key;
    this.parts = urls.map((url, i) => {
      if (!url) return null;
      const el = new Audio();
      el.crossOrigin = 'anonymous';
      el.preload = 'auto';
      el.src = offline[url] || url;
      const semis = CFG.transpose[`${this.key}/${i + 1}`];
      if (semis) {   // pads have no tempo, so shifting pitch through the playback rate is transparent
        el.preservesPitch = el.webkitPreservesPitch = el.mozPreservesPitch = false;
        el.defaultPlaybackRate = el.playbackRate = 2 ** (semis / 12);
      }
      const src = ctx.createMediaElementSource(el);
      const gain = ctx.createGain();
      gain.gain.value = 0;
      src.connect(gain).connect(stemGains[i]);
      return { el, src, gain };
    }).filter(Boolean);
    this.lead = this.parts[0]?.el;
  }
  start(fade) {
    this.gen++;
    for (const p of this.parts) {
      p.el.muted = false;
      try { p.el.currentTime = 0; } catch {}
      p.el.play().catch(() => {});
      ramp(p.gain.gain, 1, fade);
    }
  }
  // Runs inside the tap gesture so iOS allows this voice to start later from a timer.
  unlock() {
    for (const p of this.parts) {
      p.el.muted = true;
      const gen = this.gen;
      p.el.play().then(() => { if (this.gen === gen) { p.el.pause(); p.el.currentTime = 0; p.el.muted = false; } }).catch(() => {});
    }
  }
  stop(fade, dispose) {
    const gen = ++this.gen;
    for (const p of this.parts) ramp(p.gain.gain, 0, fade);
    setTimeout(() => {
      if (this.gen !== gen) return;
      for (const p of this.parts) {
        p.el.pause();
        if (dispose) { p.src.disconnect(); p.gain.disconnect(); p.el.removeAttribute('src'); p.el.load(); }
        else { try { p.el.currentTime = 0; } catch {} }
      }
    }, fade * 1000 + 150);
  }
}

// Two voices ping-pong with a crossfade at the end of the track: seamless loop even with MP3 padding.
class LoopPair {
  constructor(urls, key) {
    this.active = new Voice(urls, key);
    this.spare = new Voice(urls, key);
    this.dead = false;
    this.swapping = false;
    for (const v of [this.active, this.spare]) {
      v.lead?.addEventListener('timeupdate', () => this.check(v));
      v.lead?.addEventListener('ended', () => this.check(v, true));
    }
  }
  start() {
    this.active.start(CFG.fade);
    this.spare.unlock();
    // Watchdog: if the stream stalls (network drop on stage) restart this stem from the spare voice.
    let last = -1, strikes = 0;
    this.watch = setInterval(() => {
      const t = this.active.lead?.currentTime ?? 0;
      strikes = t === last ? strikes + 1 : 0;
      last = t;
      if (strikes >= 3) { strikes = 0; this.check(this.active, true); }
    }, 4000);
  }
  check(voice, force) {
    if (this.dead || this.swapping || voice !== this.active) return;
    const el = voice.lead, d = el.duration;
    if (!force && (!isFinite(d) || d <= 0)) return;
    const xf = isFinite(d) && d > 0 ? Math.min(CFG.loopFade, d * .25) : 1;
    if (!force && el.currentTime < d - xf - .25) return;
    this.swapping = true;
    this.spare.start(xf);
    this.active.stop(xf, false);
    [this.active, this.spare] = [this.spare, this.active];
    setTimeout(() => { this.swapping = false; }, xf * 1000 + 400);
  }
  kill() {
    this.dead = true;
    clearInterval(this.watch);
    this.active.stop(CFG.fadeOut, true);
    this.spare.stop(0, true);
  }
}

async function setWake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.on) { setWake(true); ctx?.resume(); }
});

function stopSound() {
  pairs.forEach((p) => p.kill());
  pairs = [];
  state.on = false;
  setWake(false);
}
function startSound() {
  const urls = library[state.key];
  if (!urls || !urls.some(Boolean)) return false;
  ensureAudio();
  pairs.forEach((p) => p.kill());
  // One loop per stem: stems can have different lengths and each one wraps around on its own.
  pairs = urls.map((url, i) => url && new LoopPair(urls.map((u, j) => (j === i ? u : null)), state.key)).filter(Boolean);
  pairs.forEach((p) => p.start());
  state.on = true;
  setWake(true);
  return true;
}

// Tapping a key selects it and plays; the power button stops and resumes the selected key.
function selectKey(key) {
  if (!library[key]?.some(Boolean)) return toast(`${key}: ainda não há faixas nesse tom.`);
  if (state.on && state.key === key) return;
  state.key = key;
  startSound();
  save();
  render();
}
function togglePower() {
  if (state.on) stopSound();
  else if (!state.key) toast('Escolha um tom para ligar.');
  else if (!startSound()) toast(`${state.key}: ainda não há faixas nesse tom.`);
  render();
}

/* ---------- Library (Supabase Storage) ---------- */
const bucket = () => sb.storage.from(CFG.bucket);
const publicUrl = (folder, name, v) =>
  `${CFG.supabaseUrl}/storage/v1/object/public/${CFG.bucket}/${encodeURIComponent(folder)}/${encodeURIComponent(name)}?v=${v}`;

// Folders can be plain ("C") or keep their original names ("Continuous Pad - Vol 01 C") when sent
// through the Supabase dashboard; files are slotted by the number in their name, same rule as the upload.
async function loadLibrary() {
  const { data: root } = await bucket().list('', { limit: 200 });
  const folders = (root || []).filter((f) => !f.id && parseKey(f.name));
  const next = {}, stamp = {};
  for (const [key] of KEYS) { next[key] = Array(CFG.stems).fill(null); stamp[key] = Array(CFG.stems).fill(-1); }
  await Promise.all(folders.map(async (folder) => {
    const key = parseKey(folder.name);
    const { data } = await bucket().list(folder.name, { limit: 100 });
    const files = (data || []).filter((f) => f.id && (AUDIO_RE.test(f.name) || /^\d+$/.test(f.name)));
    assignSlots(files).forEach((f, i) => {
      if (!f) return;
      const v = Date.parse(f.updated_at || f.created_at || '') || 0;
      if (v > stamp[key][i]) { stamp[key][i] = v; next[key][i] = publicUrl(folder.name, f.name, v); }   // newest wins
    });
  }));
  for (const [key] of KEYS) library[key] = next[key];
  libraryReady = true;
  render();
  prewarm();
  cacheStems();
}

// Buffers the start of every stem ahead of time (the browser shares the media cache per URL),
// so a key change starts playing right away instead of waiting for the network.
let warm = [];
function prewarm() {
  if (!user || navigator.connection?.saveData) return;
  warm.forEach((el) => { el.removeAttribute('src'); el.load(); });
  warm = Object.values(library).flat().filter(Boolean).map((url) => {
    const el = new Audio();
    el.crossOrigin = 'anonymous';
    el.preload = 'auto';
    el.src = url;
    return el;
  });
}

/* ---------- Offline ---------- */
// Every stem is saved on the device after login (Cache Storage), so the pads keep working if the
// internet drops. Cached stems play from the local copy.
const offline = {};   // remote url -> local object url
let caching = false;
async function cacheStems() {
  if (!user || caching || !('caches' in window) || navigator.connection?.saveData) return;
  caching = true;
  const info = $('#offlineInfo');
  try {
    const cache = await caches.open('pads-stems-v1');
    const mine = (k) => (library[k] || []).filter(Boolean);
    const urls = [...mine(state.key), ...KEYS.flatMap(([k]) => (k === state.key ? [] : mine(k)))];
    for (const req of await cache.keys()) if (!urls.includes(req.url)) await cache.delete(req);   // replaced stems
    let done = 0;
    for (const url of urls) {
      try {
        let res = await cache.match(url);
        if (!res) {
          const r = await fetch(url, { mode: 'cors' });
          if (!r.ok) throw new Error(r.status);
          await cache.put(url, r.clone());
          res = r;
        }
        if (!offline[url]) offline[url] = URL.createObjectURL(await res.blob());
        done++;
      } catch {}
      info.textContent = done === urls.length ? 'Offline ok' : `Baixando ${done}/${urls.length}`;
    }
    try { navigator.storage?.persist?.(); } catch {}
  } finally { caching = false; }
}
window.addEventListener('online', cacheStems);

/* ---------- Folder and file naming ---------- */
const PT = { do: 'C', re: 'D', mi: 'E', fa: 'F', sol: 'G', la: 'A', si: 'B' };
function parseKey(folder) {
  const words = folder.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/[\s_\-.()\[\]]+/).filter(Boolean);
  for (const w of words) if (PT[w]) return PT[w];
  const letter = words.find((w) => /^[a-g]$/.test(w));   // "C", "Tom C", "Pad G"; sharps/flats are ignored
  return letter ? letter.toUpperCase() : null;
}
// Nearest folder in the path that names a key (handles "Pads/Tom C/vias/1.mp3").
// Slot by the number in the file name (1.mp3, "via 2.mp3"); anything else fills the free slots in name order.
function assignSlots(files) {
  const slots = Array(CFG.stems).fill(null), rest = [];
  const sorted = [...files].sort((a, b) => a.name.localeCompare(b.name, 'pt', { numeric: true }));
  for (const f of sorted) {
    const n = +(f.name.match(/\d+/)?.[0] ?? 0);
    if (n >= 1 && n <= CFG.stems && !slots[n - 1]) slots[n - 1] = f; else rest.push(f);
  }
  for (const f of rest) { const i = slots.indexOf(null); if (i < 0) break; slots[i] = f; }
  return slots;
}

/* ---------- UI ---------- */
const keysEl = $('#keys'), fadersEl = $('#faders');
const keyBtns = {}, faderEls = [];
const powerBtn = $('#power'), powerLabel = $('#powerLabel');
powerBtn.addEventListener('click', togglePower);

KEYS.forEach(([key, name]) => {
  const b = document.createElement('button');
  b.className = 'key empty';
  b.setAttribute('aria-pressed', 'false');
  b.setAttribute('aria-label', `Tom ${name}`);
  b.innerHTML = `<strong>${key}</strong><span>${name}</span>`;
  b.addEventListener('click', () => selectKey(key));
  keysEl.append(b);
  keyBtns[key] = b;
});

function makeFader({ label, get, set, master, onChip }) {
  const el = document.createElement('div');
  el.className = 'fader' + (master ? ' master' : '');
  el.tabIndex = 0;
  el.setAttribute('role', 'slider');
  el.setAttribute('aria-orientation', 'vertical');
  el.setAttribute('aria-label', master ? 'Master' : `Via ${label}`);
  el.setAttribute('aria-valuemin', 0);
  el.setAttribute('aria-valuemax', 100);
  el.innerHTML = `<div class="fill"></div><span class="pct"></span><button class="chip" tabindex="-1">${label}</button>`;
  const fill = el.querySelector('.fill'), pct = el.querySelector('.pct'), chip = el.querySelector('.chip');

  const paint = () => {
    const v = get();
    fill.style.transform = `scaleY(${Math.max(v, .0001)})`;
    pct.textContent = Math.round(v * 100);
    el.setAttribute('aria-valuenow', Math.round(v * 100));
  };
  const update = (v) => { set(Math.min(1, Math.max(0, v))); paint(); applyGains(); };

  // Relative drag (like the iOS volume bar): a stray touch on stage never makes the level jump.
  let drag = null;
  el.addEventListener('pointerdown', (e) => {
    if (drag || (e.target === chip && onChip)) return;
    drag = { id: e.pointerId, y: e.clientY, v: get(), h: el.clientHeight };
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    update(drag.v - (e.clientY - drag.y) / drag.h);
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    el.classList.remove('dragging');
    save();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', (e) => {
    const step = { ArrowRight: .05, ArrowUp: .05, ArrowLeft: -.05, ArrowDown: -.05 }[e.key];
    if (step) { e.preventDefault(); update(get() + step); save(); }
  });
  if (onChip) chip.addEventListener('click', onChip);

  paint();
  return el;
}

for (let i = 0; i < CFG.stems; i++) {
  const el = makeFader({
    label: i + 1,
    get: () => state.levels[i],
    set: (v) => { state.levels[i] = v; },
    onChip: () => { state.mutes[i] = !state.mutes[i]; applyGains(); save(); render(); },
  });
  fadersEl.append(el);
  faderEls.push(el);
}
fadersEl.insertAdjacentHTML('beforeend', '<div class="sep"></div>');
fadersEl.append(makeFader({ label: 'M', master: true, get: () => state.master, set: (v) => { state.master = v; } }));

function render() {
  for (const [key] of KEYS) {
    keyBtns[key].setAttribute('aria-pressed', String(state.key === key));
    keyBtns[key].classList.toggle('idle', state.key === key && !state.on);
    keyBtns[key].classList.toggle('empty', !library[key]?.some(Boolean));
  }
  faderEls.forEach((el, i) => {
    el.classList.toggle('muted', state.mutes[i]);
    el.classList.toggle('missing', !!state.key && libraryReady && !library[state.key][i]);
    el.querySelector('.chip').setAttribute('aria-label', state.mutes[i] ? `Ativar via ${i + 1}` : `Mutar via ${i + 1}`);
  });
  const name = state.key && KEYS.find(([k]) => k === state.key)[1];
  if (state.on) statusEl.innerHTML = `Tocando <b>${name} (${state.key})</b>`;
  else if (!libraryReady) statusEl.textContent = 'Carregando…';
  else if (state.key) statusEl.innerHTML = `Desligado · <b>${name} (${state.key})</b>`;
  else statusEl.textContent = 'Toque em um tom';
  powerBtn.setAttribute('aria-pressed', String(state.on));
  powerLabel.textContent = state.on ? 'ON' : 'OFF';
}

let toastTimer;
function toast(msg, sticky) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.classList.remove('show'), 3600);
}

/* ---------- Auth ---------- */
const authEl = $('#auth'), authMsg = $('#authMsg'), authSubmit = $('#authSubmit');
let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  const signup = mode === 'signup';
  $('#tabLogin').setAttribute('aria-selected', String(!signup));
  $('#tabSignup').setAttribute('aria-selected', String(signup));
  $('#nameField').hidden = !signup;
  $('#authPass').autocomplete = signup ? 'new-password' : 'current-password';
  $('#authSub').textContent = signup ? 'Crie sua conta para usar os pads.' : 'Entre para tocar.';
  authSubmit.textContent = signup ? 'Criar conta' : 'Entrar';
  say('');
}
const say = (msg, kind) => { authMsg.textContent = msg; authMsg.className = kind || ''; };
const AUTH_ERRORS = [
  [/invalid login/i, 'E-mail ou senha incorretos.'],
  [/not confirmed/i, 'Confirme seu e-mail pelo link que enviamos antes de entrar.'],
  [/already registered|already been registered/i, 'Esse e-mail já tem conta. Use a aba Entrar.'],
  [/at least 6|weak/i, 'A senha precisa ter pelo menos 6 caracteres.'],
  [/rate limit|too many/i, 'Muitas tentativas agora. Espere alguns minutos e tente de novo.'],
  [/invalid.*email|valid email/i, 'Confira o e-mail digitado.'],
];
const authError = (e) => (AUTH_ERRORS.find(([re]) => re.test(e?.message || '')) || [0, `Não deu certo: ${e?.message || 'erro de rede'}`])[1];

$('#tabLogin').addEventListener('click', () => setAuthMode('login'));
$('#tabSignup').addEventListener('click', () => setAuthMode('signup'));
$('#ssoBlock').hidden = !CFG.google;
$('#googleBtn').addEventListener('click', () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }));
$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#authEmail').value.trim(), password = $('#authPass').value, name = $('#authName').value.trim();
  if (!email || password.length < 6) return say('Preencha o e-mail e uma senha de pelo menos 6 caracteres.', 'err');
  authSubmit.disabled = true;
  say(authMode === 'signup' ? 'Criando conta…' : 'Entrando…');
  try {
    if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) say('Conta criada. Abra o link que enviamos para o seu e-mail para confirmar e depois entre.', 'ok');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) { say(authError(err), 'err'); }
  authSubmit.disabled = false;
});
$('#logout').addEventListener('click', async () => { if (state.on) stopSound(); await sb.auth.signOut(); });

function applySession(session) {
  user = session?.user || null;
  authEl.hidden = !!user;
  if (!user && state.on) stopSound();
  if (user) { $('#authPass').value = ''; say(''); if (libraryReady) { if (!warm.length) prewarm(); cacheStems(); } }
  render();
}
sb.auth.onAuthStateChange((_event, session) => applySession(session));

// Forced update: when version.txt differs from this build, reload with a cache-busting URL (never while playing).
async function checkVersion() {
  try {
    const remote = (await (await fetch(`version.txt?t=${Date.now()}`, { cache: 'no-store' })).text()).trim();
    if (!remote || remote === BUILD || state.on) return;
    if (new URLSearchParams(location.search).get('v') === remote) return;   // already tried, avoid a reload loop
    location.replace(`${location.pathname}?v=${encodeURIComponent(remote)}`);
  } catch {}
}
checkVersion();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
setInterval(checkVersion, 5 * 60 * 1000);

render();
sb.auth.getSession().then(({ data }) => applySession(data.session));
loadLibrary();
</script>
</body>
